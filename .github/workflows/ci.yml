name: ci

# AD-11 : portes de build. Le job s'appelle `ci` : c'est le contexte exigé par la protection de `main`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Story 6.5 : relance par blog-automerge.yml (GITHUB_TOKEN) sur une branche blog/… mise à jour avec main, qui pose le
  # contrôle `ci` sur sa tête exacte. Une mise à jour ou une fusion faite par GITHUB_TOKEN ne déclenche pas ci.yml.
  workflow_dispatch:
    inputs:
      blog_auto:
        description: 'Traiter le build comme une PR blog-auto (placeholder dans un article bloquant, D2)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # FR40, D2 (epic 6) : sur une PR étiquetée blog-auto, un placeholder dans l'<article> d'une page de dist/
      # bloque ; ailleurs (footer, À propos…) il ne fait qu'avertir. Build INDEXABLE : tout placeholder bloque.
      # Story 6.5 : vrai aussi sur un workflow_dispatch lancé avec blog_auto (blog-automerge.yml).
      BLOG_AUTO: ${{ contains(github.event.pull_request.labels.*.name, 'blog-auto') || inputs.blog_auto == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # astro check et schémas Zod.
      - run: npm run check
      # Sources : tel:/wa.me, photos, href internes, couleurs, propriétés physiques, complétude 4 langues,
      # lint éditorial des articles (emoji, !, IDS/Maagal, lien littéral, placeholder ; AD-12, story 6.3).
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # dist/ : noindex, 404, liens (wrangler dev), budget JS, placeholders.
      - run: npm run check:dist
