  description:
    he: 'עמדת אינטרקום עם מצלמה לכניסה לבית או לבניין. רואים מי בדלת ופותחים מהטלפון. מבאר שבע ועד ירושלים.'
    en: 'A video intercom door station for a house or building entrance. See who is at the door and open from your phone. From Beer Sheva to Jerusalem.'
    ru: 'Вызывная панель видеодомофона для дома или подъезда. Видно, кто у двери, открываете с телефона. От Беэр-Шевы до Иерусалима.'
    fr: 'Une platine d’interphone vidéo pour l’entrée d’une maison ou d’un immeuble. Vous voyez qui sonne et ouvrez depuis le téléphone. De Beer-Sheva à Jérusalem.'
