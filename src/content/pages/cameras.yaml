          ru: 'Вестибюль, парковка и входы. Аккуратная запись для домового комитета.'
          fr: 'Hall, parking et entrées. Des enregistrements bien tenus pour le comité d’immeuble.'
      - title:
          he: 'לעסק'
          en: 'For your business'
          ru: 'Для бизнеса'
          fr: 'Pour le commerce'
