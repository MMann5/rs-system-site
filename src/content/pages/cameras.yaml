          he: 'חנות, משרד או מחסן. רואים מה קורה גם כשסגור.'
          en: 'Shop, office or warehouse. See what is going on even after closing.'
          ru: 'Магазин, офис или склад. Видно, что происходит, даже когда закрыто.'
